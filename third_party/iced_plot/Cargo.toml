[package]
name        = "iced_plot"
version     = "0.5.0"
edition     = "2024"
workspace   = "../../src/frontend/iced"
license     = "MIT"
description = "A GPU-accelerated plotting widget for Iced."
repository  = "https://github.com/donkeyteethUX/iced_plot/"
homepage    = "https://github.com/donkeyteethUX/iced_plot/"
readme      = "README.md"
categories  = ["gui", "graphics", "visualization"]
keywords    = ["iced", "plot", "widget", "wgpu", "plotting"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam     = "0.25"
iced     = { path = "../iced", default-features = false, features = ["advanced", "wgpu-bare", "canvas"] }
iced-fluent-theme = { path = "../iced-fluent-theme" }
indexmap = "2.14"

[features]
default = []
canvas  = ["iced/canvas"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iced = { path = "../iced", default-features = false, features = ["fira-sans", "thread-pool", "wayland", "web-colors"] }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl", "vulkan"] }


[package.metadata.vendor]
revision = "56290b6eacf4fcd74a7cd3c6ea2ec3a2d1a4944c"
origin = "https://github.com/donkeyteethUX/iced_plot/"
