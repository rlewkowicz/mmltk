[package]
name = "mmltk-browser-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
path = "src/lib.rs"
test = true

[lints.rust]
warnings = "deny"

[dependencies]
futures-channel = "0.3.32"
ciborium-io = "0.2.2"
ciborium-ll = "0.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
iced = { path = "../../../third_party/iced", default-features = false, features = ["advanced", "fira-sans", "web-colors", "wgpu-bare"] }
iced-fluent-theme = { path = "../../../third_party/iced-fluent-theme" }
iced_aw = { path = "../../../third_party/iced_aw", default-features = false, features = ["number_input", "selection_list"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Event", "EventTarget", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Location", "Navigator", "UrlSearchParams", "Window", "console"] }
wgpu = { version = "29", default-features = false, features = ["webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iced_runtime = { path = "../../../third_party/iced/runtime" }
iced = { path = "../../../third_party/iced", default-features = false, features = ["advanced", "fira-sans", "thread-pool", "wayland", "web-colors", "wgpu-bare"] }
iced-fluent-theme = { path = "../../../third_party/iced-fluent-theme" }
iced_aw = { path = "../../../third_party/iced_aw", default-features = false, features = ["number_input", "selection_list"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
# The wasm name section is what turns a trap offset into a named Rust frame in
# the Firefox stack. Stripping it leaves only "unreachable executed".
strip = false
