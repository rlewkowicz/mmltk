<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>mmltk</title>
    <base data-trunk-public-url />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #mmltk-recovery {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #111827;
        color: #fef3c7;
        font: 15px/1.5 sans-serif;
      }

      #mmltk-recovery[hidden] {
        display: none;
      }

      #mmltk-recovery > div {
        max-width: 520px;
        padding: 24px;
        text-align: center;
      }

      #mmltk-recovery button {
        margin-top: 16px;
        padding: 8px 14px;
      }
    </style>
    <script>
      (() => {
        let recoveryStarted = false;

        // Effect-only observations of Iced's actual window loop. No application
        // socket traffic, animation request, or native work depends on this.
        window.mmltkIcedWindowTraceEnabled = () => window.mmltkSurfaceTraceEnabled === true ||
          typeof window.mmltkIntegrationWindowTrace === "function";
        const emitIcedWindowTrace = (stage, fields) => {
          const state = window.mmltkIcedWindowState ??= {sequence: 0, requested: 0, redraws: 0, configured: 0, draws: 0};
          ++state.sequence;
          if (stage === "requested") ++state.requested;
          if (stage === "redraw") ++state.redraws;
          if (stage === "configured") ++state.configured;
          if (stage === "draw") ++state.draws;
          const record = {event: `iced.window.${stage}`, ...state, ...fields};
          window.mmltkIntegrationWindowTrace?.(record);
          if (window.mmltkSurfaceTraceEnabled) {
            const line = JSON.stringify(record);
            if (typeof dump === "function") dump(line + "\n");
            else console.error(line);
          }
          return state;
        };
        window.mmltkIcedWindowTrace = (stage, width, height, logicalWidth, logicalHeight, pending) => {
          if (!window.mmltkIcedWindowTraceEnabled()) return;
          const state = emitIcedWindowTrace(stage, {width, height,
            logical_width: logicalWidth, logical_height: logicalHeight, pending_resize: pending});
          if (stage === "configured") state.extent = [width, height];
          if (stage === "draw") state.draw_extent = [width, height, logicalWidth, logicalHeight];
        };
        window.mmltkIcedRootTrace = (x, y, width, height) => {
          if (!window.mmltkIcedWindowTraceEnabled()) return;
          emitIcedWindowTrace("root", {root: [x, y, width, height]});
        };

        const showRecovery = (message, manual) => {
          const recovery = document.getElementById("mmltk-recovery");
          const detail = document.getElementById("mmltk-recovery-detail");
          const button = document.getElementById("mmltk-recovery-button");
          if (!recovery || !detail || !button) {
            return;
          }
          detail.textContent = message;
          button.hidden = !manual;
          recovery.hidden = false;
          window.mmltkIntegrationRecovery?.(message, manual);
        };

        // One automatic reload per failure episode. A failure arriving after an
        // automatic reload already ran hands control to the user instead of
        // reload-looping; surviving 30 seconds ends the episode.
        const recoveryEpisodeKey = "mmltk-webgpu-recovery";
        setTimeout(() => sessionStorage.removeItem(recoveryEpisodeKey), 30000);

        window.mmltkRecoverWebGpu = (cause = "WebGPU device lost") => {
          if (recoveryStarted) {
            return;
          }
          recoveryStarted = true;
          // Reloading while training still occupies GPU memory creates another
          // device and more allocations. Keep the native job running and let
          // the user retry after memory becomes available.
          if (/out of memory|not enough memory|no more memory/i.test(cause)) {
            showRecovery(`${cause}. GPU rendering is paused; native work continues. Free GPU memory, then reload the GUI.`, true);
            return;
          }
          if (sessionStorage.getItem(recoveryEpisodeKey) === "1") {
            showRecovery(`${cause}. Automatic reload did not recover WebGPU.`, true);
            return;
          }
          sessionStorage.setItem(recoveryEpisodeKey, "1");
          showRecovery(`${cause}. Reloading the GUI in this Firefox window…`, false);
          window.location.reload();
        };

        window.mmltkManualWebGpuReload = () => {
          sessionStorage.removeItem(recoveryEpisodeKey);
          window.location.reload();
        };

        const recoverUnhandled = (value) => {
          const message =
            value instanceof Error
              ? `${value.name}: ${value.message}`
              : String(value || "");
          if (/webgpu|device lost|out of memory|unreachable executed|runtimeerror/i.test(message)) {
            window.mmltkRecoverWebGpu(message);
          }
        };
        window.addEventListener("error", (event) => recoverUnhandled(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => recoverUnhandled(event.reason));
      })();
    </script>
  </head>
  <body>
    <div id="mmltk-recovery" hidden>
      <div>
        <div id="mmltk-recovery-detail">Recovering the WebGPU GUI…</div>
        <button id="mmltk-recovery-button" hidden onclick="window.mmltkManualWebGpuReload()">
          Reload GUI
        </button>
      </div>
    </div>
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="mmltk-browser-app"
      data-wasm-opt="z"
    />
  </body>
</html>
