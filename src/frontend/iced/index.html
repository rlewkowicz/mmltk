<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>mmltk</title>
    <base data-trunk-public-url />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #mmltk-recovery {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #111827;
        color: #fef3c7;
        font: 15px/1.5 sans-serif;
      }

      #mmltk-recovery[hidden] {
        display: none;
      }

      #mmltk-recovery > div {
        max-width: 520px;
        padding: 24px;
        text-align: center;
      }

      #mmltk-recovery button {
        margin-top: 16px;
        padding: 8px 14px;
      }
    </style>
    <script>
      (() => {
        let reloadScheduled = false;

        const showRecovery = (message, manual) => {
          const recovery = document.getElementById("mmltk-recovery");
          const detail = document.getElementById("mmltk-recovery-detail");
          const button = document.getElementById("mmltk-recovery-button");
          if (!recovery || !detail || !button) {
            return;
          }
          detail.textContent = message;
          button.hidden = !manual;
          recovery.hidden = false;
        };

        // One automatic reload per failure episode. A failure arriving after an
        // automatic reload already ran hands control to the user instead of
        // reload-looping; surviving 30 seconds ends the episode.
        const recoveryEpisodeKey = "mmltk-webgpu-recovery";
        setTimeout(() => sessionStorage.removeItem(recoveryEpisodeKey), 30000);

        window.mmltkRecoverWebGpu = (cause = "WebGPU device lost") => {
          if (reloadScheduled) {
            return;
          }
          if (sessionStorage.getItem(recoveryEpisodeKey) === "1") {
            showRecovery(`${cause}. Automatic reload did not recover WebGPU.`, true);
            return;
          }
          reloadScheduled = true;
          sessionStorage.setItem(recoveryEpisodeKey, "1");
          showRecovery(`${cause}. Reloading the GUI in this Firefox window…`, false);
          window.location.reload();
        };

        window.mmltkManualWebGpuReload = () => {
          sessionStorage.removeItem(recoveryEpisodeKey);
          window.location.reload();
        };

        const recoverUnhandled = (value) => {
          const message =
            value instanceof Error
              ? `${value.name}: ${value.message}`
              : String(value || "");
          if (/webgpu|device lost|out of memory|unreachable executed|runtimeerror/i.test(message)) {
            window.mmltkRecoverWebGpu(message);
          }
        };
        window.addEventListener("error", (event) => recoverUnhandled(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => recoverUnhandled(event.reason));
      })();
    </script>
  </head>
  <body>
    <div id="mmltk-recovery" hidden>
      <div>
        <div id="mmltk-recovery-detail">Recovering the WebGPU GUI…</div>
        <button id="mmltk-recovery-button" hidden onclick="window.mmltkManualWebGpuReload()">
          Reload GUI
        </button>
      </div>
    </div>
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="mmltk-browser-app"
      data-wasm-opt="z"
    />
  </body>
</html>
